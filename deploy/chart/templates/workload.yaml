{{- $token := .Values.ingestToken -}}
{{- if not $token -}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace "audit-loupe-ingest" -}}
  {{- if $existing -}}
    {{- $token = index $existing.data "token" | b64dec -}}
  {{- else -}}
    {{- $token = randAlphaNum 40 -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: audit-loupe-ingest
  namespace: {{ .Release.Namespace }}
  labels: {{- include "at.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ $token | quote }}
{{- if .Values.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audit-loupe-data
  namespace: {{ .Release.Namespace }}
  labels: {{- include "at.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-loupe
  namespace: {{ .Release.Namespace }}
  labels: {{- include "at.labels" . | nindent 4 }}
spec:
  replicas: 1          # SQLite: one writer
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "at.labels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "at.labels" . | nindent 8 }}
      annotations:
        checksum/ingest-token: {{ $token | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: audit-loupe
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: audit-loupe
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
            - { name: ingest, containerPort: 8081 }
          env:
            - { name: AL_CLUSTER, value: {{ .Values.clusterName | quote }} }
            - { name: AL_DB_PATH, value: /data/audit-loupe.db }
            - { name: AL_TZ, value: {{ .Values.timezone | quote }} }
            - { name: AL_WORK_HOURS, value: {{ .Values.workHours | quote }} }
            - { name: AL_WORK_DAYS, value: {{ .Values.workDays | quote }} }
            - { name: AL_RETENTION_DAYS, value: {{ .Values.retentionDays | quote }} }
            {{- with .Values.watchResources }}
            - { name: AL_WATCH_RESOURCES, value: {{ . | quote }} }
            {{- end }}
            - name: AL_INGEST_TOKEN
              valueFrom: { secretKeyRef: { name: audit-loupe-ingest, key: token } }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim: { claimName: audit-loupe-data }
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: audit-loupe
  namespace: {{ .Release.Namespace }}
  labels: {{- include "at.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  {{- with .Values.service.clusterIP }}
  clusterIP: {{ . }}
  {{- end }}
  selector: {{- include "at.labels" . | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
    - { name: ingest, port: {{ .Values.service.ingestPort }}, targetPort: ingest }
{{- with .Values.networkPolicy.allowFromCIDRs }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: audit-loupe
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "at.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "at.labels" $ | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range . }}
        - ipBlock: { cidr: {{ . | quote }} }
        {{- end }}
      ports:
        - { port: 8080 }
        - { port: 8081 }
{{- end }}
