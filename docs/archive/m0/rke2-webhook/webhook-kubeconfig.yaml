# Audit webhook target for kube-apiserver.
#   CLUSTER_IP - service.clusterIP from the Helm values (default 10.43.0.200)
# The token is read from a separate file so it never appears in this file or on screen:
#   /etc/rancher/rke2/audit-trail.token  (mode 600), value from
#   Secret cattle-audit-trail/audit-trail-ingest, key "token".
# Both files must also be mounted into the kube-apiserver static pod (kube-apiserver-extra-mount).
# Plain HTTP on the node -> ClusterIP path; the token is still checked.
apiVersion: v1
kind: Config
clusters:
  - name: audit-trail
    cluster:
      server: http://CLUSTER_IP:8081/ingest/k8s-audit
contexts:
  - name: audit-trail
    context: { cluster: audit-trail, user: kube-apiserver }
current-context: audit-trail
users:
  - name: kube-apiserver
    user:
      tokenFile: /etc/rancher/rke2/audit-trail.token
