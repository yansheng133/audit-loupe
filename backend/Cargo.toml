[package]
name = "audit-loupe"
version = "0.5.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
futures = "0.3.34"
k8s-openapi = { version = "0.28.0", features = ["latest"] }
kube = { version = "4.2.0", features = ["runtime", "client"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
tokio = { version = "1.53.3", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "decompression-gzip", "compression-gzip"] }
tracing = "0.1.44"
flate2 = "1"
jiff = { version = "0.2.16", default-features = false, features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1.12", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
